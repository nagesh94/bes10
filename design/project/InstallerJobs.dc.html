<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F6F9; }
    a { color: #0B3C7E; }
    a:hover { color: #042A5E; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: Archivo, system-ui, sans-serif; color: #0F1B2D; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE3EC; padding: 9px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
    <img src="/_blob/40bea2b43b8cd7e79288b8f8905e7326" alt="BHIM Energy Solutions" style="height: 32px; width: auto; display: block; flex-shrink: 0">
    <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #042A5E; background: #EAF0F8; border: 1px solid #C9D8EC; border-radius: 999px; padding: 4px 9px; flex-shrink: 0">Installer</span>
    <span style="flex-grow: 1"></span>
    <span style="width: 34px; height: 34px; border-radius: 999px; background: #042A5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0">VY</span>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 16px 16px 18px">

    <h1 style="margin: 0 0 3px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Namaste, Vikram</h1>
    <p style="margin: 0 0 16px; font-size: 13.5px; color: #54657E">Three jobs assigned to you. One needs finishing today.</p>

    <div style="display: flex; align-items: center; gap: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 11px 13px; margin-bottom: 16px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="flex-grow: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: #15803D">Everything synced</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #15803D">09:14</span>
    </div>

    <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3">
      <a href="{{j.href}}" style="{{j.card}}">
        <span style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px">
          <span style="{{j.code}}">{{j.codeText}}</span>
          <span style="{{j.stage}}">{{j.stageText}}</span>
          <span style="flex-grow: 1"></span>
          <span style="{{j.when}}">{{j.whenText}}</span>
        </span>
        <span style="display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 3px">{{j.name}}</span>
        <span style="{{j.addr}}">{{j.address}}</span>
        <span style="display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 11px; border-top: 1px solid {{j.rule}}">
          <span style="{{j.plant}}">{{j.plantText}}</span>
          <span style="flex-grow: 1"></span>
          <span style="{{j.todo}}">{{j.todoText}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{j.arrow}}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </span>
      </a>
    </sc-for>

    <div style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 15px 16px; margin-top: 4px">
      <h2 style="margin: 0 0 8px; font-size: 14px; font-weight: 700">This month</h2>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
          <div style="flex: 1 1 0; min-width: 0; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 9px; padding: 11px 12px">
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">{{s.n}}</div>
            <div style="font-size: 11px; color: #54657E; margin-top: 2px; line-height: 1.3">{{s.label}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <nav style="background: #FFFFFF; border-top: 1px solid #DDE3EC; display: flex; flex-shrink: 0; padding: 6px 8px 10px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <a href="{{t.href}}" style="{{t.tab}}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{t.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.path}}"></path></svg>
        <span style="{{t.label}}">{{t.name}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cardBase = 'display:block;text-decoration:none;border-radius:12px;padding:15px 16px;margin-bottom:12px;';
    var codeBase = 'font-family:"IBM Plex Mono",monospace;font-size:11.5px;';
    var stageBase = 'font-size:9.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;border-radius:4px;padding:3px 7px;';
    var plantBase = 'font-size:12.5px;font-weight:600;';
    var todoBase = 'font-size:12px;font-weight:700;';

    var defs = [
      {
        code: 'BHIM-2026-0011', stage: 'Stage 4', name: 'Mohd Irfan',
        address: 'H. No. 214, Sector 9, Indira Nagar', plant: '3 kW · 6 panels',
        todo: '2 photos left', when: 'Today', urgent: true, href: 'Installer.dc.html'
      },
      {
        code: 'BHIM-2026-0015', stage: 'Stage 3', name: 'Shalini Verma',
        address: 'B-77, Aliganj, Lucknow', plant: '5 kW · 9 panels',
        todo: 'Not started', when: 'Tomorrow', urgent: false, href: 'InstallMobile.dc.html'
      },
      {
        code: 'BHIM-2026-0016', stage: 'Stage 3', name: 'Devendra Singh',
        address: 'Plot 12, Gomti Nagar Extension', plant: '10 kW · 18 panels',
        todo: 'Not started', when: '14 Oct', urgent: false, href: 'InstallMobile.dc.html'
      }
    ];

    var jobs = defs.map(function (d) {
      var u = d.urgent;
      return {
        codeText: d.code, stageText: d.stage, name: d.name, address: d.address,
        plantText: d.plant, todoText: d.todo, whenText: d.when, href: d.href,
        card: cardBase + (u
          ? 'background:#042A5E;color:#FFFFFF'
          : 'background:#FFFFFF;border:1px solid #DDE3EC;color:#0F1B2D'),
        code: codeBase + 'color:' + (u ? '#9DB6D8' : '#54657E'),
        stage: stageBase + (u ? 'background:#FF7A00;color:#042A5E' : 'background:#EAF0F8;color:#042A5E'),
        when: 'font-size:11.5px;font-weight:700;color:' + (u ? '#FF9A3C' : '#54657E'),
        addr: 'display:block;font-size:12.5px;line-height:1.45;color:' + (u ? '#B9CBE4' : '#54657E'),
        rule: u ? '#1B4278' : '#EDF1F6',
        plant: plantBase + 'color:' + (u ? '#D3E0F0' : '#0F1B2D'),
        todo: todoBase + 'color:' + (u ? '#FF9A3C' : '#54657E'),
        arrow: u ? '#FFFFFF' : '#94A3B8'
      };
    });

    var stats = [
      { n: '7', label: 'Jobs finished' },
      { n: '41', label: 'Photos uploaded' },
      { n: '0', label: 'Waiting to sync' }
    ];

    var tabBase = 'flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;height:56px;border-radius:9px;';
    var tabDefs = [
      ['My jobs', 'M4 7h16M4 12h16M4 17h10', true, '#'],
      ['Camera', 'M3 8a2 2 0 012-2h2l1.3-2h7.4L17 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z', false, 'Installer.dc.html'],
      ['Profile', 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0', false, 'Settings.dc.html']
    ];
    var tabs = tabDefs.map(function (t) {
      return {
        name: t[0], path: t[1], href: t[3],
        tab: tabBase + (t[2] ? 'background:#EAF0F8' : 'background:transparent'),
        stroke: t[2] ? '#042A5E' : '#94A3B8',
        label: 'font-size:10.5px;font-weight:' + (t[2] ? '700' : '600') + ';color:' + (t[2] ? '#042A5E' : '#94A3B8')
      };
    });

    return { jobs: jobs, stats: stats, tabs: tabs };
  }
}
</script>
</body>
</html>
