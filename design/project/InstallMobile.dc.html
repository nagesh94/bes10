<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installation on site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F6F9; }
    a { color: #0B3C7E; }
    a:hover { color: #042A5E; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: Archivo, system-ui, sans-serif; color: #0F1B2D; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE3EC; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
    <a href="InstallerJobs.dc.html" aria-label="Back to my jobs" style="width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#042A5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #54657E">BHIM-2026-0015</div>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">Stage 3 &middot; Installation</div>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #92400E; background: #FEF3C7; border-radius: 999px; padding: 5px 10px; flex-shrink: 0">Draft</span>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 18px">

    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; flex-grow: 1">Panel serials</h1>
      <span style="font-size: 12.5px; font-weight: 700; color: #C2410C">4 of 9</span>
    </div>

    <button type="button" style="width: 100%; font-family: inherit; font-size: 15px; font-weight: 700; color: #042A5E; background: #FF7A00; border: 0; border-radius: 10px; height: 56px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#042A5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"></path><path d="M3 12h18"></path></svg>
      Scan next panel
    </button>

    <div style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; overflow: hidden; margin-bottom: 18px">
      <sc-for list="{{serials}}" as="s" hint-placeholder-count="9">
        <div style="{{s.row}}">
          <span style="{{s.badge}}">{{s.n}}</span>
          <span style="{{s.text}}">{{s.sn}}</span>
          <span style="{{s.mark}}">{{s.icon}}</span>
        </div>
      </sc-for>
    </div>

    <h2 style="margin: 0 0 10px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Inverter</h2>
    <div style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 15px 16px; margin-bottom: 14px">
      <label for="isn" style="display: block; font-size: 12px; font-weight: 600; color: #54657E; margin-bottom: 6px">Serial number</label>
      <div style="display: flex; gap: 8px; margin-bottom: 14px">
        <input id="isn" type="text" value="DY24H0941207" style="flex-grow: 1; min-width: 0; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #0F1B2D; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 48px; padding: 0 12px">
        <button type="button" aria-label="Scan the inverter serial" style="width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #DDE3EC; background: #FFFFFF; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#042A5E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"></path><path d="M3 12h18"></path></svg>
        </button>
      </div>

      <label for="imodel" style="display: block; font-size: 12px; font-weight: 600; color: #54657E; margin-bottom: 6px">Model</label>
      <select id="imodel" style="width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px; color: #0F1B2D; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 48px; padding: 0 11px; margin-bottom: 14px">
        <option>Deye SUN-5K-SG04LP1</option>
        <option>Growatt MIN 5000TL-X</option>
      </select>

      <div style="font-size: 12px; font-weight: 600; color: #54657E; margin-bottom: 8px">Phase</div>
      <div style="display: flex; background: #EDF1F6; border-radius: 9px; padding: 3px; margin-bottom: 14px">
        <button type="button" style="flex: 1 1 0; font-family: inherit; border: 0; border-radius: 7px; height: 44px; cursor: pointer; font-size: 14px; font-weight: 700; background: #FF7A00; color: #042A5E">Single phase</button>
        <button type="button" style="flex: 1 1 0; font-family: inherit; border: 0; border-radius: 7px; height: 44px; cursor: pointer; font-size: 14px; font-weight: 600; background: transparent; color: #54657E">Three phase</button>
      </div>

      <div style="font-size: 12px; font-weight: 600; color: #54657E; margin-bottom: 8px">Hybrid system?</div>
      <div style="display: flex; background: #EDF1F6; border-radius: 9px; padding: 3px">
        <button type="button" style="flex: 1 1 0; font-family: inherit; border: 0; border-radius: 7px; height: 44px; cursor: pointer; font-size: 14px; font-weight: 700; background: #FF7A00; color: #042A5E">Yes</button>
        <button type="button" style="flex: 1 1 0; font-family: inherit; border: 0; border-radius: 7px; height: 44px; cursor: pointer; font-size: 14px; font-weight: 600; background: transparent; color: #54657E">No</button>
      </div>
      <p style="margin: 9px 0 0; font-size: 11.5px; color: #C2410C; font-weight: 600; line-height: 1.45">Battery details will be asked for next, because this is a hybrid.</p>
    </div>

    <h2 style="margin: 0 0 10px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Structure</h2>
    <div style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 15px 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{structure}}" as="f" hint-placeholder-count="4">
          <div>
            <label for="{{f.id}}" style="display: block; font-size: 12px; font-weight: 600; color: #54657E; margin-bottom: 6px">{{f.label}}</label>
            <input id="{{f.id}}" type="text" value="{{f.value}}" style="width: 100%; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #0F1B2D; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 48px; padding: 0 11px">
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #DDE3EC; padding: 11px 16px 13px; display: flex; gap: 10px; flex-shrink: 0">
    <button type="button" style="font-family: inherit; font-size: 14px; font-weight: 600; color: #042A5E; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 50px; padding: 0 18px; cursor: pointer; flex-shrink: 0">Save</button>
    <button type="button" disabled style="flex-grow: 1; font-family: inherit; font-size: 15px; font-weight: 700; color: #94A3B8; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 8px; height: 50px; cursor: not-allowed">5 serials left</button>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rowBase = 'display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #EDF1F6;';
    var badgeBase = 'display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:11.5px;font-weight:700;font-family:"IBM Plex Mono",monospace;flex-shrink:0;';

    var captured = ['WR24A6610441', 'WR24A6610442', 'WR24A6610455', 'WR24A6610456'];
    var serials = [];

    captured.forEach(function (sn, i) {
      serials.push({
        n: String(i + 1), sn: sn, row: rowBase,
        badge: badgeBase + 'background:#EAF0F8;color:#042A5E',
        text: 'flex-grow:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500',
        mark: 'display:flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:999px;background:#DCFCE7;color:#15803D;font-size:11px;font-weight:700;flex-shrink:0',
        icon: '✓'
      });
    });

    for (var i = captured.length; i < 9; i++) {
      serials.push({
        n: String(i + 1), sn: 'Not scanned yet',
        row: rowBase + 'background:#FBFCFE',
        badge: badgeBase + 'background:#F1F5F9;color:#94A3B8',
        text: 'flex-grow:1;min-width:0;font-size:13px;color:#94A3B8',
        mark: 'display:none', icon: ''
      });
    }

    var structure = [
      { id: 'col', label: 'Column', value: '75 × 40' },
      { id: 'raf', label: 'Rafter', value: '50 × 30' },
      { id: 'pur', label: 'Purlin', value: '40 × 25' },
      { id: 'legs', label: 'Legs', value: '12' }
    ];

    return { serials: serials, structure: structure };
  }
}
</script>
</body>
</html>
