<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>पाइपलाइन डैशबोर्ड</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F6F9; }
    a { color: #0B3C7E; }
    a:hover { color: #042A5E; }
  </style>
</helmet>

<div style="min-height: 100%; background: #F4F6F9; font-family: 'Noto Sans Devanagari', Archivo, system-ui, sans-serif; color: #0F1B2D; -webkit-font-smoothing: antialiased">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE3EC; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 22px; min-height: 64px">
    <img src="/_blob/40bea2b43b8cd7e79288b8f8905e7326" alt="BHIM Energy Solutions" style="height: 38px; width: auto; display: block; flex-shrink: 0">
    <nav style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" style="{{n.style}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <label style="display: flex; align-items: center; gap: 8px; background: #F4F6F9; border: 1px solid #DDE3EC; border-radius: 8px; padding: 0 12px; height: 40px; min-width: 230px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">खोजें</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54657E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="कोड, नाम, उपभोक्ता संख्या" style="border: 0; background: transparent; outline: none; font-family: inherit; font-size: 13.5px; color: #0F1B2D; width: 100%">
    </label>
    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
      <span style="display: inline-flex; background: #EDF1F6; border-radius: 7px; padding: 2px">
        <button type="button" style="font-family: Archivo, sans-serif; font-size: 12px; font-weight: 600; color: #54657E; background: transparent; border: 0; border-radius: 5px; height: 30px; padding: 0 10px; cursor: pointer">EN</button>
        <button type="button" style="font-family: inherit; font-size: 12px; font-weight: 700; color: #042A5E; background: #FFFFFF; border: 0; border-radius: 5px; height: 30px; padding: 0 10px; cursor: pointer; box-shadow: 0 1px 2px rgba(4,42,94,0.12)">हिं</button>
      </span>
      <span style="width: 36px; height: 36px; border-radius: 999px; background: #042A5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">AK</span>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 24px">
      <div style="flex-grow: 1; min-width: 260px">
        <h1 style="margin: 0 0 4px; font-size: 27px; font-weight: 700; letter-spacing: -0.01em">पाइपलाइन</h1>
        <p style="margin: 0; font-size: 14px; color: #54657E">14 सक्रिय आवासीय परियोजनाएँ &middot; पीएम सूर्य घर</p>
      </div>
      <button type="button" style="font-family: inherit; font-size: 14px; font-weight: 700; color: #042A5E; background: #FF7A00; border: 0; border-radius: 8px; padding: 0 18px; height: 46px; cursor: pointer; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#042A5E" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        नई लीड
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="{{k.card}}">
          <div style="{{k.label}}">{{k.title}}</div>
          <div style="{{k.value}}">{{k.n}}</div>
          <div style="{{k.subStyle}}">{{k.sub}}</div>
        </div>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 18px 20px; margin-bottom: 24px">
      <h2 style="margin: 0 0 14px; font-size: 13px; font-weight: 600; color: #54657E; letter-spacing: 0.02em">चरण अनुसार परियोजनाएँ</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{stages}}" as="st" hint-placeholder-count="9">
          <button type="button" style="font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px 0 8px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDE3EC; color: #0F1B2D">
            <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: #042A5E; color: #FFFFFF; font-size: 12px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">{{st.n}}</span>
            <span style="font-size: 13px; font-weight: 600">{{st.name}}</span>
            <span style="font-size: 12px; font-weight: 700; color: #54657E; background: #F1F5F9; border-radius: 999px; padding: 2px 8px; font-family: 'IBM Plex Mono', monospace">{{st.c}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; overflow: hidden">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #DDE3EC">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600; flex-grow: 1">सभी परियोजनाएँ</h2>
        <button type="button" style="font-family: inherit; font-size: 13px; font-weight: 600; color: #042A5E; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 38px; padding: 0 14px; cursor: pointer">फ़िल्टर</button>
        <button type="button" style="font-family: inherit; font-size: 13px; font-weight: 600; color: #042A5E; background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 8px; height: 38px; padding: 0 14px; cursor: pointer">निर्यात</button>
      </div>

      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; min-width: 1000px">
          <thead>
            <tr style="background: #F8FAFC">
              <sc-for list="{{heads}}" as="h" hint-placeholder-count="7">
                <th style="{{h.style}}">{{h.t}}</th>
              </sc-for>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
              <tr style="border-bottom: 1px solid #EDF1F6">
                <td style="padding: 14px 20px; vertical-align: middle">
                  <a href="#" style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: #0B3C7E; text-decoration: none">{{r.code}}</a>
                  <div style="{{r.lifeStyle}}">{{r.life}}</div>
                </td>
                <td style="padding: 14px 12px; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 500; vertical-align: middle">{{r.name}}</td>
                <td style="padding: 14px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #54657E; vertical-align: middle; white-space: nowrap">{{r.plant}}</td>
                <td style="padding: 14px 12px; vertical-align: middle">
                  <div style="display: flex; gap: 3px; margin-bottom: 6px">
                    <sc-for list="{{r.dots}}" as="d" hint-placeholder-count="9">
                      <span style="{{d.s}}"></span>
                    </sc-for>
                  </div>
                  <div style="font-size: 12.5px; font-weight: 600; color: #042A5E">{{r.stage}}</div>
                </td>
                <td style="padding: 14px 12px; vertical-align: middle"><span style="{{r.flagStyle}}">{{r.flag}}</span></td>
                <td style="padding: 14px 12px; font-family: Archivo, sans-serif; font-size: 13.5px; color: #54657E; vertical-align: middle; white-space: nowrap">{{r.owner}}</td>
                <td style="padding: 14px 20px; font-size: 13px; color: #54657E; vertical-align: middle; white-space: nowrap">{{r.updated}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <div style="padding: 14px 20px; font-size: 13px; color: #54657E; border-top: 1px solid #EDF1F6">14 में से 7 दिखाए जा रहे हैं &middot; <a href="#" style="font-weight: 600">सभी देखें</a></div>
    </section>
  </main>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    var navBase = 'padding:10px 14px;border-radius:8px;font-size:14px;text-decoration:none;';
    var nav = [
      ['पाइपलाइन', true], ['लीड', false], ['परियोजनाएँ', false], ['दस्तावेज़', false], ['एडमिन', false]
    ].map(function (n) {
      return {
        label: n[0],
        style: navBase + (n[1]
          ? 'font-weight:600;color:#042A5E;background:#EAF0F8'
          : 'font-weight:500;color:#54657E')
      };
    });

    var cardBase = 'background:#FFFFFF;border-radius:12px;padding:18px 20px;border:1px solid ';
    var kpis = [
      { title: 'सक्रिय परियोजनाएँ', n: '14', sub: '', border: '#DDE3EC', tone: '#0F1B2D', labelTone: '#54657E' },
      { title: 'खुले फ़्लैग', n: '3', sub: '2 नाम परिवर्तन · 1 लोड वृद्धि', border: '#F0D9A8', tone: '#92400E', labelTone: '#92400E' },
      { title: 'पोर्टल अपलोड शेष', n: '2', sub: 'पैक भेजने के लिए तैयार', border: '#DDE3EC', tone: '#0F1B2D', labelTone: '#54657E' },
      { title: 'बकाया राशि', n: '₹8,42,000', sub: '6 ग्राहकों से', border: '#DDE3EC', tone: '#0F1B2D', labelTone: '#54657E', mono: true }
    ].map(function (k) {
      return {
        title: k.title, n: k.n, sub: k.sub,
        card: cardBase + k.border,
        label: 'font-size:12.5px;font-weight:600;color:' + k.labelTone,
        value: 'font-size:31px;font-weight:700;letter-spacing:-0.01em;margin-top:6px;color:' + k.tone +
          (k.mono ? ';font-family:"IBM Plex Mono",monospace' : ''),
        subStyle: k.sub ? 'font-size:12px;color:#54657E;margin-top:4px' : 'display:none'
      };
    });

    var stageNames = ['ऑनबोर्डिंग', 'अनुबंध', 'स्थापना', 'साक्ष्य', 'डीसीआर', 'मीटर', 'दस्तावेज़', 'कमीशनिंग', 'निपटान'];
    var counts = [3, 2, 1, 2, 1, 1, 2, 1, 1];
    var stages = stageNames.map(function (n, i) {
      return { n: String(i + 1), name: n, c: String(counts[i]) };
    });

    var th = 'text-align:left;font-size:11.5px;font-weight:700;color:#54657E;border-bottom:1px solid #DDE3EC;';
    var heads = [
      ['परियोजना', 'padding:11px 20px'], ['ग्राहक', 'padding:11px 12px'], ['संयंत्र', 'padding:11px 12px'],
      ['चरण', 'padding:11px 12px;width:270px'], ['ध्यान दें', 'padding:11px 12px'],
      ['प्रभारी', 'padding:11px 12px'], ['अद्यतन', 'padding:11px 20px']
    ].map(function (h) { return { t: h[0], style: th + h[1] }; });

    var GREEN = '#2B9A3E', ORANGE = '#FF7A00', GREY = '#CBD5E1';
    function dots(stage) {
      var out = [];
      for (var i = 1; i <= 9; i++) {
        var bg = i < stage ? GREEN : (i === stage ? ORANGE : GREY);
        out.push({ s: 'display:block;width:' + (i === stage ? 20 : 12) + 'px;height:6px;border-radius:3px;background:' + bg });
      }
      return out;
    }

    var pill = 'display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;';
    var amber = pill + 'background:#FEF3C7;color:#92400E';
    var green = pill + 'background:#DCFCE7;color:#15803D';
    var none = 'font-size:14px;color:#94A3B8';
    var lifeChip = 'display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 7px;';

    var defs = [
      ['BHIM-2026-0014', 'प्रॉस्पेक्ट', 'Ramesh Chauhan', '3 kW', 1, 'ऑनबोर्डिंग', 'लोड वृद्धि', amber, 'Priya S.', '2 घंटे पहले'],
      ['BHIM-2026-0012', 'प्रॉस्पेक्ट', 'Sunita Devi', '5 kW', 2, 'अनुबंध', 'नाम में अंतर', amber, 'Amit K.', '5 घंटे पहले'],
      ['BHIM-2026-0011', 'ग्राहक', 'Mohd Irfan', '3 kW', 4, 'साक्ष्य', '—', none, 'Priya S.', 'कल'],
      ['BHIM-2026-0009', 'ग्राहक', 'Kavita Sharma', '10 kW', 5, 'डीसीआर प्रमाणपत्र', '—', none, 'Amit K.', 'कल'],
      ['BHIM-2026-0007', 'ग्राहक', 'Rajesh Kumar', '5 kW', 7, 'दस्तावेज़', 'पैक तैयार', green, 'Priya S.', '2 दिन पहले'],
      ['BHIM-2026-0005', 'ग्राहक', 'Anand Patel', '4 kW', 8, 'कमीशनिंग', '—', none, 'Amit K.', '3 दिन पहले'],
      ['BHIM-2026-0002', 'ग्राहक', 'Neha Gupta', '3 kW', 9, 'निपटान', 'सब्सिडी प्राप्त', green, 'Priya S.', '4 दिन पहले']
    ];

    var rows = defs.map(function (d) {
      return {
        code: d[0], life: d[1], name: d[2], plant: d[3],
        dots: dots(d[4]), stage: 'चरण ' + d[4] + ' · ' + d[5],
        flag: d[6], flagStyle: d[7], owner: d[8], updated: d[9],
        lifeStyle: lifeChip + (d[1] === 'ग्राहक'
          ? 'background:#EAF0F8;color:#042A5E'
          : 'background:#FFF1E3;color:#C2410C')
      };
    });

    return { nav: nav, kpis: kpis, stages: stages, heads: heads, rows: rows };
  }
}
</script>
</body>
</html>
