# Production side-services for a single Linux box (Hostinger KVM, Mumbai).
#
#   cd /srv/bhim-crm/current
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Postgres, MinIO and Gotenberg all run here, beside the app. That is the whole
# point of choosing a VPS: queries are sub-millisecond instead of the 68 ms
# measured to a database in Singapore, and customer documents — including
# scanned Aadhaar cards — stay on Indian soil.
#
# Three differences from the development compose, all of which matter on a box
# with a public IP:
#
#   1. Every port is bound to 127.0.0.1. The development file publishes on
#      0.0.0.0, which is harmless on a laptop behind NAT and would expose
#      Postgres and MinIO to the whole internet here. Nothing in this file
#      needs to be reachable from outside; the app talks to all three over
#      loopback and nginx is the only public listener.
#   2. Credentials come from the environment, so the development passwords
#      cannot be deployed by accident. `docker compose` reads the same .env
#      the app does.
#   3. Mailpit is absent — it exists to swallow outgoing mail in development.

name: bhim-crm-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: bhim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bhim_crm}
    ports:
      # 5432 here, not the 5433 development uses — that offset exists only to
      # dodge a Postgres already installed on the developer's machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-bhim_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Postgres is the one service whose death loses data in flight.
    stop_grace_period: 30s

  # MinIO, packaged by Bitnami.
  #
  # MinIO Inc. withdrew the community images in 2025, so this is a frozen tag
  # that will not receive updates. That is an accepted risk rather than an
  # oversight: the port is bound to loopback, so nothing outside this box can
  # reach it, and the app is the only client. If you would rather not run an
  # unmaintained image at all, point the S3_* variables at Neon Object Storage
  # instead — the code is identical either way — and accept that document
  # scans then live in Singapore rather than India.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: bhim-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET_DOCUMENTS:-bhim-documents},${S3_BUCKET_TEMP:-bhim-temp}
      MINIO_SCHEME: http
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      # The web console stays off in production. Re-publish it on loopback and
      # reach it through an SSH tunnel if you ever need to browse objects:
      #   ssh -L 9001:127.0.0.1:9001 bhim@<server>
      # - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  # Converts the generated DOCX into PDF for the submission pack. LibreOffice
  # behind an HTTP API, so the app never shells out to a binary.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: bhim-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--api-timeout=60s"
    ports:
      # Loopback only. Gotenberg has no authentication of its own — anything
      # that can reach this port can convert arbitrary files on this box.
      - "127.0.0.1:3001:3000"
    # LibreOffice is memory-hungry and a stuck conversion must not take the
    # app down with it. 768 MB leaves room on a 4 GB box for Next, Postgres
    # and MinIO together.
    mem_limit: 768m

volumes:
  postgres-data:
  minio-data:
