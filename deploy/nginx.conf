# /etc/nginx/sites-available/bhim-crm  (symlink into sites-enabled)
#
# TLS terminates here and the app is reached over loopback. Certbot fills in
# the certificate paths:
#   sudo certbot --nginx -d crm.bes247.tech

upstream bhim_crm {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Plain HTTP exists only to redirect and to answer the ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name crm.bes247.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.bes247.tech;

    ssl_certificate     /etc/letsencrypt/live/crm.bes247.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.bes247.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # HSTS belongs here rather than in next.config.ts, because the app also
    # answers on plain HTTP over loopback and must not send this there.
    # Two years, and note it commits this hostname to HTTPS in every browser
    # that has visited it — do not add it until the certificate renews cleanly.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Rooftop photos. The app's own Server Action limit is 12 MB; nginx has to
    # allow at least as much or the upload fails at the proxy with a 413 that
    # never reaches the app's error handling.
    client_max_body_size 16m;
    # A phone on a weak rural connection uploads slowly. The default 60s body
    # timeout drops those uploads halfway.
    client_body_timeout 120s;

    # Document generation merges several PDFs through LibreOffice and can take
    # the better part of a minute on this instance class.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        proxy_pass http://bhim_crm;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://bhim_crm;
        proxy_http_version 1.1;

        # Next reads these to build absolute URLs and to know the request was
        # HTTPS. Without X-Forwarded-Proto it would issue http:// redirects
        # and the secure session cookie would never be set.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
    }

    # Reachable for a health check, but not worth logging.
    location = /api/health {
        proxy_pass http://bhim_crm;
        access_log off;
    }
}
