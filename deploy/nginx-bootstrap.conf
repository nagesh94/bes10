# Stage-one nginx config: HTTP only, no certificate referenced.
#
# This exists to break a chicken-and-egg: deploy/nginx.conf names the
# Let's Encrypt certificate, which does not exist until Certbot has issued it
# — and Certbot cannot issue it until something answers the ACME challenge on
# port 80. nginx therefore refuses to start, and you are stuck.
#
# So: install this first, get the certificate, then replace it with the real
# config.
#
#   cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/bhim-crm
#   ln -sf /etc/nginx/sites-available/bhim-crm /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
#   certbot certonly --webroot -w /var/www/html -d crm.bes247.tech
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/bhim-crm
#   nginx -t && systemctl reload nginx
#
# `certonly` is deliberate rather than `--nginx`: the plugin would rewrite the
# config itself and discard the tuned upload limits and timeouts in
# deploy/nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name crm.bes247.tech;

    # Where Certbot writes its challenge file.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The app, so the site is usable over plain HTTP in the gap before the
    # certificate exists. The real config redirects this to HTTPS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
    }
}
