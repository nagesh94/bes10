# The one service this app needs locally: the document converter.
#
#   docker compose up -d
#
# Postgres and MinIO used to live here. They are gone because the database and
# the object store are both Neon now, in development and on the server alike —
# which is also why there is a single .env with nothing to switch.
#
# Gotenberg stays a container because it is LibreOffice behind an HTTP API, and
# nobody wants LibreOffice installed on the host.

name: bhim-crm

services:
  # Converts the generated DOCX into PDF for the submission pack.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: bhim-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--api-timeout=60s"
    ports:
      # Loopback only. Gotenberg has no authentication of its own — anything
      # that can reach this port can convert arbitrary files on this machine,
      # so it must never be published on 0.0.0.0 on a box with a public IP.
      - "127.0.0.1:3001:3000"
    # LibreOffice is memory-hungry and a stuck conversion must not take the
    # app down with it.
    mem_limit: 768m
